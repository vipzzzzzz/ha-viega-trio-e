fill_bath:
  name: Fill bath
  description: >-
    Fill the bathtub with a set volume of water at a set temperature.
    The Trio E stops on its own when the volume is reached.
  fields:
    temperature:
      name: Temperature
      description: Water temperature in °C.
      required: true
      example: 40
      selector:
        number:
          min: 20
          max: 60
          step: 0.5
          unit_of_measurement: "°C"
    volume:
      name: Volume
      description: Amount of water in litres.
      required: true
      example: 180
      selector:
        number:
          min: 1
          max: 2000
          step: 1
          unit_of_measurement: "L"
